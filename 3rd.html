<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>points show</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: "Tajawal", sans-serif;
  margin: 0; padding: 0;
  background: url("https://i.ibb.co/0yZqDqzf/colorful-flat-comic-style-background-free-vector.jpg") no-repeat center center fixed;
  background-size: cover;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; flex-direction: column;
  overflow: hidden;
}
@keyframes gradientBG {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
#welcome, #pointsPage {
  display: none;
  text-align: center;
  position: relative;
  z-index: 10;
}
h1 { font-size: 2.4em; color: #2d3436; text-shadow: 2px 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
button {
  background: linear-gradient(45deg, #fd79a8, #e84393);
  color: white; border: none;
  padding: 14px 28px; border-radius: 12px; cursor: pointer;
  font-size: 1.2em; transition: transform 0.3s ease, box-shadow 0.3s ease;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}
.container {
  background: rgba(0, 0, 255, 0.12); /* أزرق شفاف */
  border: 2px solid #e84393;
  padding: 28px 22px;
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  width: 95%; max-width: 480px;
  margin-top: 20px; /* يخلي المربع تحت زيزو بشكل طبيعي */
  box-sizing: border-box;
  z-index: 2;
  position: relative; /* مش absolute علشان يبان على الموبايل */
}
input {
  width: 100%; padding: 18px; /* كبر البادينج */
  border: 1px solid #ccc; border-radius: 14px;
  font-size: 1.3em; /* كبر الخط */
  transition: border 0.3s ease, box-shadow 0.3s ease;
  box-sizing: border-box;
}
.suggestions {
  background: #fff; border-radius: 12px; border: 1px solid #ddd;
  max-height: 150px; overflow-y: auto;
}
.suggestions div {
  padding: 10px; cursor: pointer; transition: background 0.3s ease;
  font-size: 1em;
}
.suggestions div:hover { background: #dfe6e9; }
#result {
  background: #f1f2f6;
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  font-size: 1.2em;
  color: #2d3436;
  transition: opacity 0.5s ease;
}

/* شخصية زيزو */
#zizo-container {
  position: fixed;
  top: 5vh;
  left: 50%;
  transform: translateX(-50%);
  width: 50vw;
  height: auto;
  z-index: 1;
  pointer-events: none;
  opacity: 0.95;
}
/* فقاعات */
.float-layer{position:fixed;inset:0;pointer-events:none;z-index:0}
.bubble{
  position:absolute; width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,0.7);
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  animation: rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(110vh) scale(0.8); opacity:0}
  10%{opacity:1}
  100%{transform:translateY(-20vh) scale(1.2); opacity:0}
}
</style>
</head>
<body>
<!-- فقاعات -->
<div class="float-layer" id="floatLayer"></div>
  
<!-- الصفحة الترحيبية -->
<div id="welcome">
  <h1>🎯 أهلاً بك 🎯</h1>
  <button onclick="goToPoints()">شوف نقاطك ⭐</button>
</div>

<!-- صفحة عرض النقاط -->
<div id="pointsPage">
  <div class="container">
    <h2>شوف نقاطك ⭐</h2>
    <input id="nameInput" placeholder="اكتب اسمك هنا">
    <div class="suggestions" id="suggestions"></div>
    <button onclick="getPoints()">اعرض النتيجة</button>
    <div id="result"></div>
  </div>
</div>

<!-- شخصية زيزو -->
<div id="zizo-container">
  <video id="zizo-video" autoplay loop muted playsinline style="width:100%; height:100%;">
    <source src="videos/zizo-wave.mp4" type="video/mp4">
  </video>
</div>
<script>
const apiURL = "https://3rd-system-grades.johnmamdouh777.workers.dev";
let allNames = [];

// تشغيل أول صفحة
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("welcome").style.display = "block";
  loadNames();
  generateBubbles();
});

async function loadNames() {
  try {
    const res = await fetch(apiURL + "?name=load_names");
    const data = await res.json();
    if (data.names) {
      allNames = data.names;
      console.log("✅ Loaded Names from server:", allNames); // 👈 هنا بيطبع كل الأسماء
    } else {
      console.error("⚠️ No names in response:", data);
    }
  } catch (err) {
    console.error("خطأ في تحميل الأسماء", err);
  }
}

// اقتراح الأسماء + حالة التفكير
const nameInput = document.getElementById("nameInput");
let isThinking = false; // فلَاج علشان نتحكم في تشغيل الفيديو

nameInput.addEventListener("input", () => {
  const val = nameInput.value.trim();
  const box = document.getElementById("suggestions");
  box.innerHTML = "";

  if (val && !isThinking) {
    setZizoState("think"); // زيزو يبدأ الكتابة مرة واحدة
    isThinking = true;
  }

  if (!val) {
    isThinking = false; // لو رجع فاضي نرجع الفلَاج
    return;
  }

  const matches = allNames.filter(n => n.includes(val)).slice(0,5);
  matches.forEach(name => {
    const div = document.createElement("div");
    div.textContent = name;
    div.onclick = () => { nameInput.value = name; box.innerHTML = ""; };
    box.appendChild(div);
  });
});

// الانتقال لصفحة النقاط + حالة الاستعداد
async function getPoints() {
  const name = nameInput.value.trim();
  const resultBox = document.getElementById("result");
  if (!allNames.includes(name)) {
    resultBox.innerText = "❌ الاسم غير مسجل";
    setZizoState("sad");
    return;
  }

  // هات earned و minus من الـ API
  const res = await fetch(apiURL + "?name=" + encodeURIComponent(name));
  const data = await res.json();

  if (data.error) {
    resultBox.innerText = data.error;
    setZizoState("sad");
    return;
  }

  // 🟢 هات بيانات الهدايا من ورقة Feria
  const feriaRes = await fetch(apiURL + "?type=feriaAll");
  const feriaData = await feriaRes.json();
  const feriaRows = feriaData.records || [];

  // 🟢 خريطة الهدايا → النقاط
  const giftPointsMap = {
    "لعبة": 4,
    "كراسة رسم": 3,
    "ألوان": 2,
    "ستيكرات": 1,
    "كتاب صغير": 5
  };

// 🟢 احسب المستخدم (used) من ورقة Feria
let used = 0;
feriaRows.forEach(r => {
  const childName = String(r["الاسم"] || "").trim();
  if (childName !== name) return;

  // خد الهدايا من العمود F و G (لو موجود)
  const giftF = String(r["F"] || "").trim();
  const giftG = String(r["G"] || "").trim();

  // اجمعهم في نص واحد
  const giftName = [giftF, giftG].filter(Boolean).join(" ");
  if (!giftName) return;

  // قسم الخلية على أي فاصل (مسافة، تاب، فاصلة)
  const gifts = giftName.split(/\s{2,}|[,،]/).map(g => g.trim()).filter(Boolean);

  gifts.forEach(g => {
    // مثال: "5 : كتاب صغير"
    const parts = g.split(":").map(x => x.trim());
    if (parts.length < 2) return;

    const qty = Number(parts[0]) || 1;   // العدد قبل النقطتين
    const giftBase = parts[1];           // الاسم بعد النقطتين

    console.log("Gift parsed:", giftBase, "Qty:", qty);
    used += (giftPointsMap[giftBase] || 0) * qty;
  });
});

  // 🟢 احسب المحصلة النهائية
  const earned = Number(data.total || 0);
  const minus = Number(data.minus || 0);
  const final = earned - used - minus;

  // 🟢 اعرض النتيجة
  resultBox.style.opacity = 0;
  setTimeout(() => {
    resultBox.innerHTML = `
      👤 الاسم: ${data.name}<br>
      ⭐ النقاط الكلية: ${earned}<br>
      🎁 النقاط المستخدمة: ${used}<br>
      ➖ النقاط المخصومة: ${minus}<br>
      🏆 <strong>المحصلة النهائية: ${final}</strong>
    `;
    resultBox.style.opacity = 1;
    setZizoState("win");
  }, 200);
}

// فقاعات
function generateBubbles() {
  const layer = document.getElementById('floatLayer');
  for(let i=0;i<24;i++){
    const b=document.createElement('div');
    b.className='bubble';
    b.style.left=Math.random()*100+'vw';
    b.style.animationDuration=(10+Math.random()*12)+'s';
    b.style.animationDelay=(Math.random()*5)+'s';
    b.style.opacity=0.6+Math.random()*0.4;
    layer.appendChild(b);
  }
}

// دالة تغيير حالة زيزو
function setZizoState(state) {
  const video = document.getElementById("zizo-video");
  video.src = "videos/zizo-" + state + ".mp4";
  video.load();
  video.play();
}

  function goToPoints() {
  setZizoState("ready"); // زيزو متحمس
  document.getElementById("welcome").style.display = "none";
  document.getElementById("pointsPage").style.display = "block";
}

</script>
</body>
</html>
